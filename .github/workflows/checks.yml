name: FreeMusicPlayer checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test *.test.mjs
        working-directory: vibe-music-provider
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: bash mvnw -B test
        working-directory: vibe-music-backend
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install client dependencies
        run: pnpm install --frozen-lockfile
        working-directory: vibe-music-client
      - name: Test client utilities
        run: pnpm test
        working-directory: vibe-music-client
      # Vite generates ignored src/auto-import/*.d.ts files. A fresh checkout
      # must build before vue-tsc can resolve the project's auto-imported APIs.
      - name: Build client and generate auto-import declarations
        run: pnpm build
        working-directory: vibe-music-client
      - name: Type-check client after declaration generation
        run: pnpm type-check
        working-directory: vibe-music-client
      - name: Install admin dependencies
        run: pnpm install --frozen-lockfile
        working-directory: vibe-music-admin
      - name: Build admin
        run: pnpm build
        working-directory: vibe-music-admin
