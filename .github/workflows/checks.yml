name: FreeMusicPlayer checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test *.test.mjs
        working-directory: vibe-music-provider
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: bash mvnw -B test
        working-directory: vibe-music-backend
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
        working-directory: vibe-music-client
      - run: pnpm test && pnpm type-check && pnpm build
        working-directory: vibe-music-client
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: vibe-music-admin
