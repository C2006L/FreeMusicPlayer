services:
  mysql:
    image: mysql:8.0
    container_name: vibe-music-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: vibe_music_root_dev
      MYSQL_DATABASE: vibe_music
      MYSQL_USER: vibe_music
      MYSQL_PASSWORD: vibe_music_dev
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    volumes:
      - ./.runtime/mysql:/var/lib/mysql
      - ./sql/vibe_music.sql:/docker-entrypoint-initdb.d/01-vibe-music.sql:ro
      - ./sql/migrations/20261021_online_catalog.sql:/docker-entrypoint-initdb.d/02-online-catalog.sql:ro
      - ./sql/migrations/20261022_provider_metadata.sql:/docker-entrypoint-initdb.d/03-provider-metadata.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pvibe_music_root_dev --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: vibe-music-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "vibe_music_redis_dev"]
    ports:
      - "6379:6379"
    volumes:
      - ./.runtime/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "vibe_music_redis_dev", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  go-music-api:
    # Kept as a separate AGPL service and consumed through its public REST API.
    # Pinning the digest makes local setup reproducible while preserving the
    # license boundary with this MIT-licensed repository.
    image: guohuiyuan/go-music-api:latest@sha256:3e026fa42a6b262fd3df1aab0058c6b965e7a5b7d068aa7525c7c7605b9378e4
    container_name: freemusicplayer-go-music-api
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3002:8080"
    volumes:
      - ./.runtime/go-music-api/cookies.json:/home/appuser/cookies.json

  minio:
    profiles: ["media"]
    # The upstream image registries were withdrawn in 2026. This mirror is
    # pinned to the published image digest so local setup stays reproducible.
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z@sha256:624bad2fe79a8613aa3c5c9b765ebcab365080b8445cf1b05c357cc7753725f0
    container_name: vibe-music-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.runtime/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    profiles: ["media"]
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z@sha256:624bad2fe79a8613aa3c5c9b765ebcab365080b8445cf1b05c357cc7753725f0
    container_name: vibe-music-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/vibe-music-data &&
        mc anonymous set download local/vibe-music-data
